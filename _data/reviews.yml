items:
  - name: "Баршагуль Р"
    date_ru: "12 ноября 2026"
    date_kk: "12 қараша 2026"
    text: "Большой ассортимент и персонал очень приветливый и терпеливый, видно знает что продает. Я уже так привыкла к ним, даже не смотрю зимние вещи где-то еще."
  - name: "Гүлназ Тілеубаева"
    date_ru: "10 ноября 2026"
    date_kk: "10 қараша 2026"
    text: "Все мои сестрёнки одеваются тут. Качество одежды всегда хорошее, а консультанты всегда вежливые - никогда не откажут в просьбе!"
  - name: "Saniyusha"
    date_ru: "23 сентября 2026"
    date_kk: "23 қыркүйек 2026"
    text: "Смело могу сказать, что это самый лучший магазин в этом районе. Продавцы всегда вежливые и быстро находят нужные размеры."
  - name: "Айгерим Сулейменова"
    date_ru: "26 июля 2026"
    date_kk: "26 шілде 2026"
    text: "Мектепке деген киімдердің біраз әдемі үлгілері бар, ешқайда бармай-ақ барлығын бір жерден алып кеткен қандай жақсы. Киімдер де сапалы."
  - name: "Қызғалдақ Өмірзақова"
    date_ru: "17 сентября 2026"
    date_kk: "17 қыркүйек 2026"
    text: "Несмотря на то, что магазин довольно маленький, выбор очень большой. Качество всегда радует. … Всем рекомендую))"
  - name: "Zhanna. O"
    date_ru: "15 ноября 2025"
    date_kk: "15 қараша 2025"
    text: "Сегодня купили сыну зимний костюм в вашем магазине. Остались очень довольны качеством костюма."
